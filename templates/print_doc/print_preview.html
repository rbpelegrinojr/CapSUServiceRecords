<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Service Record</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #f8f9fa;
        }
        #pdfFrame {
            width: 100%;
            height: 100%;
            border: 0;
        }
        #errorMsg {
            display: none;
            padding: 2rem;
            font-family: sans-serif;
            color: #842029;
            background: #f8d7da;
        }
        @media print {
            @page {
                size: {{ page_width }}in {{ page_height }}in;
                margin: 0;
            }
        }
    </style>
</head>
<body>
    <div id="errorMsg">
        ⚠️ The PDF could not be loaded. Please go back and try again. Make sure
        LibreOffice (Linux/macOS) or Microsoft Word (Windows) is installed.
    </div>
    <iframe id="pdfFrame" src="{{ pdf_url }}" title="Service Record PDF"></iframe>
    <script>
        (function () {
            var frame = document.getElementById('pdfFrame');
            var errorMsg = document.getElementById('errorMsg');
            var pdfUrl = {{ pdf_url|tojson }};

            frame.addEventListener('error', function () {
                frame.style.display = 'none';
                errorMsg.style.display = 'block';
            });

            document.addEventListener('keydown', function (event) {
                var isPrintShortcut = (event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'p';
                if (!isPrintShortcut) return;

                event.preventDefault();

                try {
                    if (frame.contentWindow) {
                        frame.contentWindow.focus();
                        frame.contentWindow.print();
                        return;
                    }
                } catch (err) {
                    // Fallback handled below.
                }

                // Last fallback: open the PDF directly so browser print still shows content.
                window.open(pdfUrl, '_blank');
            });
        })();
    </script>
</body>
</html>
