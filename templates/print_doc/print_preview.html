<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Service Record</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #f8f9fa;
        }
        #pdfFrame {
            width: 100%;
            height: 100%;
            border: 0;
        }
        #errorMsg {
            display: none;
            padding: 2rem;
            font-family: sans-serif;
            color: #842029;
            background: #f8d7da;
        }
    </style>
</head>
<body>
    <div id="errorMsg">
        ⚠️ The PDF could not be loaded. Please go back and try again. Make sure
        LibreOffice (Linux/macOS) or Microsoft Word (Windows) is installed.
    </div>
    <iframe id="pdfFrame" src="{{ pdf_url }}" title="Service Record PDF"></iframe>
    <script>
        (function () {
            var frame = document.getElementById('pdfFrame');
            var errorMsg = document.getElementById('errorMsg');

            frame.addEventListener('error', function () {
                frame.style.display = 'none';
                errorMsg.style.display = 'block';
            });

            // Wait for the iframe to finish loading, then trigger print on the
            // main window. Calling print() on contentWindow is blocked by most
            // browsers when the iframe contains a PDF, so window.print() is the
            // reliable cross-browser approach.
            frame.addEventListener('load', function () {
                setTimeout(function () {
                    window.print();
                }, 1200);
            });
        })();
    </script>
</body>
</html>
